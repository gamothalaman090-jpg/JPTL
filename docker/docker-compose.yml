services:
  server:
    image: oven/bun:1
    container_name: server
    working_dir: /app
    volumes:
      - ../apps/server:/app
      - server_node_modules:/app/node_modules
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ../apps/server/.env
    command: sh -c "bun install && bunx nodemon --legacy-watch --exec bun run server.js"
    tty: true
    stdin_open: true

  client:
    image: oven/bun:1
    container_name: client
    working_dir: /app
    volumes:
      - ../apps/client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ../apps/client/.env
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0"
    depends_on:
      - server
    tty: true
    stdin_open: true

volumes:
  server_node_modules:
  client_node_modules: